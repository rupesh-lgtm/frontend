<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Primary SEO -->
    <title>Innovix Technology | Software, Mobile App & AI Development Company in Noida, India</title>
    <meta
      name="description"
      content="Innovix Technology is a leading software, mobile app, and AI development company in Noida, India. We provide web development, cloud solutions, cybersecurity, and digital transformation services."
    />
    <meta
      name="keywords"
      content="Innovix Technology, software company in Noida, mobile app development India, AI development company, web development services, IT solutions India, cloud services, cybersecurity services"
    />
    <meta name="author" content="Innovix Technology" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.innovixtechnology.com/" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:title" content="Innovix Technology - Software & AI Development Company" />
    <meta
      property="og:description"
      content="Top IT company in Noida offering software, mobile apps, AI, and cloud solutions."
    />
    <meta property="og:image" content="https://www.innovixtechnology.com/og-image.jpg" />
    <meta property="og:url" content="https://www.innovixtechnology.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Innovix Technology - IT Solutions Company" />
    <meta
      name="twitter:description"
      content="Expert in software, mobile app & AI development services in India."
    />
    <meta name="twitter:image" content="https://www.innovixtechnology.com/og-image.jpg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Innovix Technology",
        "url": "https://www.innovixtechnology.com",
        "logo": "https://www.innovixtechnology.com/logo.png",
        "description": "Software, Mobile App, and AI Development Company in Noida, India",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Noida",
          "addressRegion": "Uttar Pradesh",
          "addressCountry": "India"
        },
        "sameAs": [
          "https://www.facebook.com/",
          "https://www.linkedin.com/",
          "https://twitter.com/"
        ]
      }
    </script>

    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
